<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0F1C32" />
  <title>SiPANTAU</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0F1C32;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: #1B2A4A;
      border: 2px solid #F5A623;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
      font-size: 2rem;
      font-weight: 700;
      color: #F5A623;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
    }
    .subtitle {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.6);
      margin-bottom: 2rem;
      line-height: 1.4;
    }
    .status {
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      max-width: 320px;
      width: 100%;
    }
    .status p {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.8);
      line-height: 1.5;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(245,166,35,0.3);
      border-top-color: #F5A623;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .footer {
      position: fixed;
      bottom: 2rem;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.3);
    }
  </style>
</head>
<body>
  <div class="logo">SP</div>
  <h1>SiPANTAU</h1>
  <p class="subtitle">
    Sistem Pengawasan Anggota Terpadu<br />
    Unit I Subdit IV Ditreskrimsus
  </p>
  <div class="status">
    <div class="spinner"></div>
    <p>Menghubungkan ke server&hellip;</p>
    <p style="margin-top:0.75rem; font-size:0.75rem; color:rgba(255,255,255,0.5);">
      Pastikan perangkat terhubung ke internet.
      Bila masalah berlanjut, hubungi administrator.
    </p>
  </div>
  <div class="footer">Polda Jawa Barat</div>
</body>
</html>
