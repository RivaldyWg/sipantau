name: Build APK

# Jalankan setiap kali ada push ke main, atau manual dari tab Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Pasang Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasang Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pasang Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependensi npm
        run: npm ci

      - name: Sinkronisasi Capacitor
        run: npx cap sync android

      - name: Pastikan gradlew bisa dijalankan
        run: chmod +x android/gradlew

      - name: Build APK debug
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             sipantau-debug.apk

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: sipantau-apk
          path: sipantau-debug.apk
          retention-days: 30
